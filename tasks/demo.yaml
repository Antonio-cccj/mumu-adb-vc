start: confirm_button
fallback: wait_retry
max_steps: 8
emergency_stop: false

nodes:
  - name: confirm_button
    roi: [0, 0, 1280, 720]
    template: confirm_button.png
    threshold: 0.85
    action: click
    next: close_popup
    timeout_ms: 3000
    retry: 2
    on_fail: wait_retry

  - name: close_popup
    roi: [0, 0, 1280, 720]
    template: close_popup.png
    threshold: 0.85
    action: click
    next: stop_demo
    timeout_ms: 3000
    retry: 2
    on_fail: wait_retry

  - name: wait_retry
    action: wait
    wait_ms: 1000
    next: confirm_button
    timeout_ms: 1000
    retry: 1

  - name: stop_demo
    action: stop
    timeout_ms: 1000
    retry: 1
